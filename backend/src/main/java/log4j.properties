
# Root logger option
log4j.rootLogger= INFO, stdout, file
log4j.logger.org.hibernate=ERROR
log4j.logger.com.mchange=ERROR
log4j.logger.net.sf.json.xml=ERROR

# Hibernate logging options (INFO only shows startup messages)
#log4j.logger.org.hibernate=INFO
log4j.logger.net.sf.json.xml.XMLSerializer=ERROR
# Log JDBC bind parameter runtime arguments
#log4j.logger.org.hibernate.type=DEBUG

#log4j.logger.com.example=INFO, MyAppender
log4j.logger.cacatua.persistence.postgresql.dao=FATAL, stdout
log4j.logger.cacatua.infrastructure=FATAL, stdout

# Direct log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=/tmp/backendHFC.log
log4j.appender.file.MaxFileSize=1MB
log4j.appender.file.MaxBackupIndex=1
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d %-5p %C.%M(%L)=> %m%n

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d %-5p %C.%M(%L)=> %m%n


