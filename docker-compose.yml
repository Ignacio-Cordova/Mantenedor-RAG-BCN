services:
  postgres:
    image: postgres:17-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mantenedor_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantenedor_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  splade:
    build: ./splade-service
    container_name: rag_splade
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: rag_ollama_init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      ollama pull qwen3-embedding:8b &&
      ollama pull gemma3:4b
      "

  backend:
    build: ./backend
    container_name: rag_backend
    ports:
      - "8080:8080"
    volumes:
      - rag_archivos:/var/mantenedor-rag/archivos
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      splade:
        condition: service_started
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      RAG_ARCHIVOS_DIR: /var/mantenedor-rag/archivos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mantenedor_rag
      DB_USER: postgres
      DB_PASSWORD: 1234
      QDRANT_HOST: http://qdrant:6333
      SPLADE_URL: http://splade:8000/splade
      OLLAMA_URL: http://ollama:11434

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
  rag_archivos: