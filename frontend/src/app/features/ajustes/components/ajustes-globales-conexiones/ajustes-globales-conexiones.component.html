<div class="modal-ajustes-body">
    <div class="mat-elevation-z0" *ngIf="!mostrarModalFormulario" style="margin-top: 20px;">
        <table mat-table [dataSource]="conexiones" class="mat-table">
            
            <ng-container matColumnDef="nombre">
                <th mat-header-row *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>

            <ng-container matColumnDef="host">
                <th mat-header-row *matHeaderCellDef> Host </th>
                <td mat-cell *matCellDef="let element"> {{element.host}} </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-row *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let element">
                    <span class="material-icons text-primary me-2" style="cursor: pointer;" 
                          (click)="abrirModalConexion(element)" title="Editar">edit</span>
                    <span class="material-icons text-danger" style="cursor: pointer;" 
                          (click)="onEliminar(element)" title="Eliminar">delete</span>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnas"></tr>
            <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
        </table> 
        
        <mat-paginator [length]="total" [pageSize]="5"></mat-paginator>
    </div>
    <div class="mat-elevation-z0" *ngIf="mostrarModalFormulario" style="margin-top: 20px;">
        <app-form-conexion [conexionSeleccionada]="conexionSeleccionada" (cerrarModal)="recargarTabla()" *ngIf="conexionSeleccionada"></app-form-conexion>
    </div>
</div>

<div class="modal-ajustes-footer">
    <div class="modal-ajustes-btns">
        <button class="btn btn-primary" (click)="onGuardarCambios(conexionSeleccionada)" *ngIf="mostrarModalFormulario && conexionSeleccionada">Guardar</button>
        <button class="btn btn-primary" (click)="abrirModalConexion()" *ngIf="!mostrarModalFormulario">Agregar Conexion</button>
    </div>
</div>
