<div class="modal-ajustes-body">
    <div class="mat-elevation-z0" *ngIf="!modalApiAbierto" style="margin-top: 20px;">
        <table mat-table [dataSource]="apis" class="mat-table">
            
            <ng-container matColumnDef="nombre">
                <th mat-header-row *matHeaderCellDef> Nombre </th>
                <td mat-cell *matCellDef="let element"> {{element.nombreProveedor}} </td>
            </ng-container>

            <ng-container matColumnDef="host">
                <th mat-header-row *matHeaderCellDef> URL / Host </th>
                <td mat-cell *matCellDef="let element"> {{element.baseUrl}} </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-row *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let element">
                    <span class="material-icons text-primary me-2" style="cursor: pointer;" 
                          (click)="abrirModalApi(element)" title="Editar">edit</span>
                    <span class="material-icons text-danger" style="cursor: pointer;" 
                          (click)="onEliminar(element)" title="Eliminar">delete</span>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnas"></tr>
            <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
        </table> 
        
        <mat-paginator [length]="total" [pageSize]="5"></mat-paginator>
    </div>
    <div class="mat-elevation-z0" *ngIf="modalApiAbierto" style="margin-top: 20px;">
        <app-form-api [apiSeleccionada]="apiSeleccionada" (cerrarModal)="onCerrarModal()" *ngIf="apiSeleccionada"></app-form-api>
    </div>
</div>
<div class="modal-ajustes-footer">
    <div class="modal-ajustes-btns">
        <input type="submit" value="Guardar" class="btn btn-primary" (click)="onGuardarCambios(apiSeleccionada)" *ngIf="modalApiAbierto && apiSeleccionada">
        <button class="btn btn-primary" (click)="abrirModalApi()" *ngIf="!modalApiAbierto">Agregar API</button>
    </div>
</div>
