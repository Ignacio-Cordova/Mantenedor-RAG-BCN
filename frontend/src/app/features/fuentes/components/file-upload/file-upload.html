<div class="container">
  <div *ngIf="errorMessage" class="inline-error" role="alert">
    {{ errorMessage }}
  </div>
  
  <div 
    class="drop-zone p-5 text-center bg-light mb-4"
    [class.hovering]="isHovering"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"> <input 
      #fileInput 
      type="file" 
      multiple 
      hidden 
      accept=".txt,text/plain" 
      (change)="onFileSelected($event)">

    <div class="icono-upload mb-2"></div> <h5>Arrastra tus archivos aquí</h5>
    <p class="text-muted">o haz clic para buscar en tu carpeta</p>

  </div>


  <div *ngIf="archivos.length > 0">
    <h6 class="mb-3">Archivos listos para subir ({{ archivos.length }})</h6>
    
    <ul class="list-group">
      <li *ngFor="let archivo of archivos; let i = index" class="list-group-item d-flex justify-content-between align-items-center">
        
        <div class="d-flex align-items-center gap-3">
          <span class="fs-4"></span>
          <div>
            <strong>{{ archivo.name }}</strong>
          </div>
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="borrarArchivo(i)">
            Eliminar
          </button>
        </div>
      </li>
    </ul>

    <div class="mt-3 text-end">
      <button class="btn btn-primary" (click)="crearArchivos()">Subir Archivos</button>
    </div>
  </div>

</div>
